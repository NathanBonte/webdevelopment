<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Box</title>
    <style>
        body{
            background-color: yellow;
            color: green;
            border : 2px solid red;
            font-size: 5em;
        }

        h1 {
            color :red;
            background-color: blue;
            width: 50%;
            font-size: 3em;
            border : 1px solid red;
            /*margin : 50px;*/
            padding: 50px 20px 100px 300px; /*hij begint altijd aan de top, dan wijzers volgen*/
            /*margin-top : 150px;*/
            margin : 200px 300px; /*bij deze is de eerst voor top en bottom; de tweede left en right*/
        }

        span {
            display: inline-block;
            width : 400px;
        }

        p {
            display: inline-block;
            background-color: gray;
            width : 49%;
        }

        img {
            display: block;
            margin-left: auto;
            margin-right: auto;
        }
    </style>
</head>
<body>
<h1>VIVES</h1>
<h1>CSS</h1>
<span>hallo</span>
<span>CSS</span>
<p>Kortrijk</p>

<h2>nieuwe regel</h2>

<span>element 1</span>
<span>element 2</span>
<span>element 3</span>
<span>element 4</span>
<span>element 5</span>

<h2>paragraaf</h2>

<p>SELECTOR</p>
<p>SELECTOR</p>

<h2>image</h2>
<span>element 1</span>
<img alt="hond" src="../image/hond.jpeg"/>

</body>
</html>
